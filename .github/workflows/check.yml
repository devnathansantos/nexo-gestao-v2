name: Verificar NEXO
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Compilar para a subpasta do Pages
        env:
          VITE_BASE_PATH: /nexo-gestao-v2/
          VITE_SUPABASE_URL: https://sgytnlhqmbaljrrzufcc.supabase.co
          # Only used in this check artifact; test:pages intercepts every API request.
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_pages_test_not_a_real_key
        run: npm run build
      - run: npm run check:performance
      - run: npm run test:pages
